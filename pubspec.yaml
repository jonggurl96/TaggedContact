name: tagged_contact
description: "태그로 기억하는 나의 연락처"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # 기본 입력창과 날짜 선택기에 한국어를 적용한다.
  flutter_localizations:
    sdk: flutter
  # 이모지와 조합 문자를 포함한 사용자 인식 글자 수를 계산한다.
  characters: ^1.4.1

dev_dependencies:
  # Android 플랫폼 채널과 실제 로컬 저장소를 검증한다.
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
