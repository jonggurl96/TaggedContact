# main 브랜치에 push된 커밋에 새 버전의 Git 태그를 붙이는 워크플로입니다.
# 저장 위치: 저장소 루트의 .github/workflows/release.yml
# 버전 형식: vMAJOR.MINOR.PATCH (예: v1.2.3)
# push 대상의 마지막 커밋 제목이 major:로 시작하면 MAJOR를 1 증가시키고 MINOR/PATCH를 0으로 초기화합니다.
# minor:로 시작하면 MINOR를 1 증가시키고 PATCH를 0으로 초기화하며, patch:로 시작하면 PATCH만 1 증가시킵니다.
# 예: v1.2.3 → major:이면 v2.0.0, minor:이면 v1.3.0, patch:이면 v1.2.4
# 최초 릴리스 이후에는 그 외 접두사나 접두사가 없는 제목을 버전업 없이 정상 종료합니다.
# init:는 버전이 없는 기존 프로젝트를 v1.0.0으로 초기화합니다. 기존 정식 버전은 유지합니다.
# 정식 버전 태그가 없는 최초 실행은 접두사와 관계없이 v1.0.0을 생성합니다.
# 최초 push는 정식 버전 태그가 없는 상태로 판별합니다. 기존 저장소에 도입해도 같은 규칙입니다.
# package.json이나 Gradle의 버전 값은 수정하지 않으며 태그와 GitHub Release를 생성합니다.
# 아래 이름은 GitHub 저장소의 Actions 화면에 표시됩니다.
name: Auto Version

# 실행 조건을 정의합니다.
# main으로 직접 push하거나 PR을 병합하여 main에 push 이벤트가 발생하면 실행합니다.
# 한 번에 여러 커밋을 push해도 커밋마다 실행하는 것이 아니라 push 이벤트 단위로 실행합니다.
# branches만 지정했으므로 태그 push와 다른 브랜치의 push는 실행 대상이 아닙니다.
# 기본 브랜치가 main이 아니라면 아래 브랜치 이름을 실제 이름으로 변경합니다.
on:
  push:
    branches:
      - main

# GitHub가 실행마다 제공하는 GITHUB_TOKEN에 저장소 콘텐츠 쓰기 권한을 부여합니다.
# 새 Git 태그 push와 GitHub Release 게시에 필요하며 별도의 PAT Secret은 사용하지 않습니다.
# 명시하지 않은 권한은 none으로 설정되어 다른 종류의 쓰기 권한을 부여하지 않습니다.
# 저장소/조직의 정책 및 태그 생성 제한 규칙이 있으면 push가 거부될 수 있습니다.
permissions:
  contents: write

# 같은 그룹의 실행을 직렬화하여 태그 조회와 생성 작업이 서로 겹치지 않도록 합니다.
# 이 설정이 없으면 두 실행이 같은 최신 태그를 읽고 같은 다음 버전을 만들 수 있습니다.
# 그룹 이름은 저장소 안에서 공유되므로 다른 워크플로에서 같은 이름을 쓰면 함께 직렬화됩니다.
# false는 현재 실행 중인 작업을 새로운 push 때문에 취소하지 않는다는 뜻입니다.
# 단, 실행 중 1개와 대기 중 1개만 유지하므로 push가 몰리면 기존 대기 실행은 대체될 수 있습니다.
# 따라서 모든 push에 반드시 하나씩 태그가 생성되는 것은 아니며, 실행 순서도 보장되지 않습니다.
# 이 그룹에 참여하지 않는 수동 태그 생성이나 다른 워크플로까지 잠그는 설정은 아닙니다.
concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  # 버전 태그를 계산하고 원격 저장소에 push한 뒤 GitHub Release를 게시하는 단일 작업입니다.
  version:
    # 브랜치 삭제로 발생한 push 이벤트에서는 버전 생성 작업을 실행하지 않습니다.
    if: github.event.deleted == false
    # Git과 Bash를 사용할 수 있는 GitHub 호스팅 Ubuntu 실행 환경을 사용합니다.
    runs-on: ubuntu-latest
    # 네트워크 지연 등으로 작업이 계속 실행되지 않도록 전체 작업 시간을 5분으로 제한합니다.
    timeout-minutes: 5
    steps:
      # 저장소의 코드와 태그를 실행 환경으로 가져옵니다.
      - name: Checkout pushed commit and all tags
        # 액션의 커밋 SHA를 고정해 같은 코드가 실행되도록 합니다. 해당 버전은 v4.2.2입니다.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 버전 v4.2.2 고정
        with:
          # 얕은 복제 대신 모든 브랜치와 태그의 전체 이력을 가져옵니다.
          # 전체 태그를 조회할 수 있지만 저장소 이력이 크면 다운로드 시간도 늘어납니다.
          fetch-depth: 0
          # 실행 중 main에 새 커밋이 추가되어도 이번 push를 발생시킨 커밋을 대상으로 합니다.
          # checkout이 기본적으로 구성하는 GITHUB_TOKEN 인증은 뒤의 git push에도 사용됩니다.
          ref: ${{ github.sha }}

      - name: Increment version and publish GitHub Release
        # Ubuntu 환경에서 Bash 문법과 명령어를 사용합니다.
        shell: bash
        # GitHub CLI 인증에 기본 토큰을 사용합니다. Release 생성에도 contents: write가 필요합니다.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # -e: 명령이 실패하면 스크립트를 종료합니다. 조건문 등 Bash의 예외 문맥은 제외됩니다.
          # -u: 정의하지 않은 변수를 사용하면 오류로 처리합니다.
          # pipefail: 파이프 중간 명령의 실패도 전체 파이프의 실패로 처리합니다.
          set -euo pipefail

          # checkout 이후 다른 실행에서 생성했을 수 있는 원격 태그를 다시 가져옵니다.
          # 이 명령은 HEAD를 다른 커밋으로 이동시키지 않습니다.
          git fetch origin --tags

          # 현재 커밋에 이미 정식 버전 태그가 있으면 새로운 버전을 만들지 않습니다.
          # 성공했던 워크플로를 재실행하거나 이미 태그가 있는 커밋으로 push할 때 중복을 막습니다.
          # --points-at HEAD: 현재 체크아웃한 커밋을 가리키는 태그만 조회합니다.
          # --list 'v*': 이름이 v로 시작하는 태그만 조회합니다.
          # 정규식은 v로 시작하는 숫자 세 부분을 허용합니다. 예: v0.0.1, v12.3.45
          # 각 부분은 0 또는 0이 아닌 숫자로 시작해야 하므로 v01.2.3은 제외합니다.
          # ^와 $로 전체 이름을 검사하므로 v1.2.3-beta 및 v1.2.3+build도 제외합니다.
          # sort -V는 버전 숫자 순으로 정렬하고 tail -n 1은 가장 큰 버전을 선택합니다.
          # || true는 일치하는 태그가 없어 grep이 종료 코드 1을 반환해도 계속 진행하게 합니다.
          # 단, 이 구문은 해당 조회 파이프의 다른 오류도 무시하므로 오류 진단 시 참고합니다.
          existing_tag=$(git tag --points-at HEAD --list 'v*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V | tail -n 1 || true)
          if [[ -n "$existing_tag" ]]; then
            # -n은 문자열이 비어 있지 않은지 확인합니다.
            # GITHUB_STEP_SUMMARY에 기록한 내용은 GitHub Actions 실행 요약에 표시됩니다.
            echo "Commit already versioned: $existing_tag" >> "$GITHUB_STEP_SUMMARY"
            # 태그 push 후 Release 생성만 실패했던 실행을 복구할 수 있도록 계속 진행합니다.
            next_tag="$existing_tag"
          else

            # 전체 태그 중 위와 같은 정식 버전 형식에 맞는 태그를 조회합니다.
            # 브랜치나 현재 커밋의 조상으로 범위를 제한하지 않고 저장소 전체 태그를 기준으로 합니다.
            # 가장 최근에 생성된 태그가 아니라 숫자상 가장 큰 버전의 태그를 선택합니다.
            # 예를 들어 v1.9.9와 v1.10.0이 있으면 v1.10.0을 기준으로 증가시킵니다.
            latest_tag=$(git tag --list 'v*' \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -V | tail -n 1 || true)
            # 이번 push의 마지막 커밋(HEAD)의 제목을 읽습니다. 본문은 판별 대상이 아닙니다.
            # 여러 커밋을 push해도 마지막 커밋의 제목만 사용합니다.
            # PR을 merge commit 방식으로 병합했다면 병합 커밋 제목이 판별 기준입니다.
            # 메시지를 GitHub 표현식으로 셸 코드에 직접 삽입하지 않고 Git 출력으로 읽어
            # 메시지에 포함된 따옴표나 셸 명령 구문이 코드로 실행되지 않도록 합니다.
            commit_subject=$(git log -1 --format=%s HEAD)

            # init:는 기존 프로젝트에 최초 정식 버전을 부여하는 명시적 초기화 접두사입니다.
            # 이미 정식 태그가 있으면 버전을 되돌리거나 태그를 덮어쓰지 않습니다.
            if [[ "$commit_subject" == init:* ]]; then
              if [[ -n "$latest_tag" ]]; then
                echo "Initialization skipped: version already exists ($latest_tag)." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              next_tag="v1.0.0"
            # 최초 자동 초기화도 유지합니다. 태그가 없으면 다른 제목도 v1.0.0입니다.
            elif [[ -z "$latest_tag" ]]; then
              next_tag="v1.0.0"
            else
              # ${latest_tag#v}로 앞의 v를 제거하고 IFS를 점으로 지정해 세 숫자를 분리합니다.
              # 예: v1.2.3 → major=1, minor=2, patch=3
              IFS='.' read -r major minor patch <<< "${latest_tag#v}"


              # 대소문자를 구분하며 제목 맨 앞의 major:, minor:, patch: 접두사만 인정합니다.
              # 콜론 뒤의 공백 유무와 관계없이 접두사가 일치하면 해당 버전을 증가시킵니다.
              # 예: major: API 변경 → MAJOR 증가, feat: major: 설명 또는 Major: 변경 → 버전업 없음
              case "$commit_subject" in
                major:*)
                  # MAJOR 증가 시 하위 버전인 MINOR와 PATCH를 모두 0으로 초기화합니다.
                  next_tag="v$((major + 1)).0.0"
                  ;;
                minor:*)
                  # MAJOR는 유지하고 MINOR를 증가시키며 PATCH를 0으로 초기화합니다.
                  next_tag="v${major}.$((minor + 1)).0"
                  ;;
                patch:*)
                  # MAJOR/MINOR는 유지하고 PATCH만 증가시킵니다. 9 다음은 10입니다.
                  next_tag="v${major}.${minor}.$((patch + 1))"
                  ;;
                *)
                  # 지원하지 않는 접두사 또는 접두사 없는 커밋은 태그 생성과 push를 건너뜁니다.
                  # 의도적인 생략이므로 실패 처리하지 않고 실행 요약을 기록한 뒤 정상 종료합니다.
                  echo "Version unchanged: no major:, minor:, or patch: prefix." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
              esac
            fi

            # push 이벤트의 대상 커밋인 HEAD에 로컬 경량 태그를 생성합니다.
            # 별도 태그 메시지나 태그 작성자 정보를 기록하는 annotated 태그는 아닙니다.
            git tag "$next_tag" HEAD
            # 이번에 생성한 태그 하나만 원격 저장소로 전송합니다.
            # 브랜치 커밋은 추가하지 않으며 기존 원격 태그를 강제로 덮어쓰지도 않습니다.
            # 외부에서 동일 태그를 먼저 생성했다면 push가 실패할 수 있으며 자동 재시도는 없습니다.
            # 기본 GITHUB_TOKEN으로 발생시킨 태그 push는 일반적인 후속 push 워크플로를 촉발하지 않습니다.
            git push origin "refs/tags/$next_tag"
            # push까지 성공한 경우에만 이전 버전과 새 버전을 실행 요약에 기록합니다.
            echo "Version: $latest_tag → $next_tag" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 모든 페이지를 조회하여 동일 태그의 Release가 있는지 확인합니다.
          # API 인증/네트워크 오류는 set -e로 실패 처리하며 Release가 없는 것으로 오인하지 않습니다.
          # next_tag는 숫자 버전 형식으로 검증된 태그이므로 아래 jq 조건에 안전하게 사용할 수 있습니다.
          release_url=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$next_tag\") | .html_url")
          if [[ -n "$release_url" ]]; then
            # 기존 Release의 제목이나 본문은 덮어쓰지 않습니다.
            echo "Release already exists: $release_url" >> "$GITHUB_STEP_SUMMARY"
          else
            # 원격 태그가 존재하는 경우에만 생성하여 잘못된 커밋의 태그 자동 생성을 방지합니다.
            # 제목은 버전 태그, 본문은 GitHub가 생성한 릴리스 노트입니다.
            # draft/prerelease 옵션을 사용하지 않으므로 정식 Release로 즉시 게시됩니다.
            release_url=$(gh release create "$next_tag" \
              --verify-tag --title "$next_tag" --generate-notes)
            echo "Release published: $release_url" >> "$GITHUB_STEP_SUMMARY"
          fi
